<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dukaandar Login</title>
<style>
    body {
        margin: 0;
        font-family: 'Segoe UI', sans-serif;
        background: linear-gradient(135deg, #2ecc71, #27ae60);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }

    .container {
        background: white;
        padding: 40px;
        border-radius: 20px;
        width: 350px;
        text-align: center;
        box-shadow: 0 10px 30px rgba(0,0,0,0.2);
    }

    h1 {
        color: #27ae60;
        margin-bottom: 10px;
    }

    p {
        color: #777;
        margin-bottom: 30px;
    }

    .btn {
        width: 100%;
        padding: 12px;
        margin: 10px 0;
        border: none;
        border-radius: 10px;
        font-size: 16px;
        cursor: pointer;
        transition: 0.3s;
    }

    .customer {
        background: #2ecc71;
        color: white;
    }

    .shopkeeper {
        background: #f39c12;
        color: white;
    }

    .btn:hover {
        transform: scale(1.05);
        opacity: 0.9;
    }

    input {
        width: 100%;
        padding: 10px;
        margin: 10px 0;
        border-radius: 8px;
        border: 1px solid #ccc;
    }

    .login-btn {
        background: #27ae60;
        color: white;
    }

    .footer {
        margin-top: 15px;
        font-size: 12px;
        color: #aaa;
    }
</style>
</head>
<body>

<div class="container">
    <h1>Dukaandar</h1>
    <p>Login as</p>

    <button class="btn customer" onclick="showLogin('customer')">👤 Customer</button>
    <button class="btn shopkeeper" onclick="showLogin('shopkeeper')">🏪 Shopkeeper</button>

    <div id="loginForm" style="display:none;">
        <input type="text" placeholder="Username">
        <input type="password" placeholder="Password">
        <button class="btn login-btn">Login</button>
    </div>

    <div class="footer">Empowering Local दुकानदार</div>
</div>

<script>
function showLogin(type) {
    document.getElementById('loginForm').style.display = 'block';
}
</script>

</body>
</html>
